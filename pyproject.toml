[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmkb"
version = "0.1.0"
description = "Multimodal knowledge base schema and implementation foundations"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0.39,<2.1",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<0.5",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "jieba>=0.42.1,<0.43",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
  "boto3>=1.35,<2",
  "Pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL or RustFS"]

[tool.setuptools.packages.find]
include = ["mmkb*"]
