[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmkb"
version = "0.1.0"
description = "Multimodal knowledge base schema and implementation foundations"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0.39,<2.1",
  "alembic>=1.16,<2",
  "pgvector>=0.4,<0.5",
  "psycopg2-binary>=2.9,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "jieba>=0.42.1,<0.43",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL or RustFS"]

[tool.setuptools.packages.find]
include = ["mmkb*"]
